name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        # validate 只做静态校验，不建立连接；提供占位值满足 env() 引用即可
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/ci?schema=public
          DATABASE_URL_UNPOOLED: postgresql://user:pass@localhost:5432/ci?schema=public
        run: npx prisma validate

      - name: Build
        run: npm run build
