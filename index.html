<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lushanjun1127 · 个人主页</title>
    <style>
        /* 全局重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f0f2f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* 主容器 - 左右 2:8 分栏 */
        .container {
            display: flex;
            max-width: 1000px;
            width: 100%;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            min-height: 420px;
        }

        /* ===== 左栏 (20%) ===== */
        .sidebar {
            width: 20%;
            background: linear-gradient(145deg, #6c5ce7, #a29bfe);
            padding: 36px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            color: #fff;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 44px;
            margin-bottom: 16px;
            flex-shrink: 0;
        }

        .sidebar h2 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .sidebar .sub {
            font-size: 13px;
            opacity: 0.8;
            font-weight: 400;
            margin-bottom: 20px;
        }

        .sidebar .social a {
            display: inline-block;
            margin: 0 6px;
            color: #fff;
            text-decoration: none;
            font-size: 20px;
            opacity: 0.75;
            transition: opacity 0.2s;
        }

        .sidebar .social a:hover {
            opacity: 1;
        }

        /* ===== 右栏 (80%) ===== */
        .main {
            width: 80%;
            padding: 40px 44px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .main h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 8px;
        }

        .main .tagline {
            font-size: 18px;
            color: #6b7280;
            margin-bottom: 16px;
            font-weight: 400;
        }

        .main .desc {
            font-size: 15px;
            color: #4b5563;
            line-height: 1.8;
            max-width: 520px;
            margin-bottom: 24px;
        }

        .main .links {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .main .links a {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 30px;
            background: #f0f2f5;
            color: #1a1a2e;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s, color 0.2s, transform 0.15s;
        }

        .main .links a:hover {
            background: #6c5ce7;
            color: #fff;
            transform: scale(1.03);
        }

        /* ===== 小屏适配 ===== */
        @media (max-width: 700px) {
            .container {
                flex-direction: column;
                border-radius: 24px;
                min-height: auto;
            }
            .sidebar {
                width: 100%;
                padding: 28px 20px;
                border-radius: 24px 24px 0 0;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                gap: 8px 16px;
            }
            .avatar {
                width: 72px;
                height: 72px;
                font-size: 32px;
                margin-bottom: 0;
            }
            .sidebar h2 {
                font-size: 18px;
                margin-bottom: 0;
            }
            .sidebar .sub {
                margin-bottom: 0;
                font-size: 13px;
            }
            .sidebar .social {
                margin-left: 4px;
            }
            .main {
                width: 100%;
                padding: 28px 24px;
            }
            .main h1 {
                font-size: 22px;
            }
            .main .tagline {
                font-size: 16px;
            }
        }

        @media (max-width: 480px) {
            .sidebar {
                flex-direction: column;
                align-items: center;
                text-align: center;
                gap: 4px;
            }
            .main {
                padding: 20px 18px;
            }
            .main .links a {
                font-size: 13px;
                padding: 6px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ===== 左栏 20% ===== -->
        <aside class="sidebar">
            <div class="avatar">🌿</div>
            <h2>Lushanjun</h2>
            <span class="sub">@lushanjun1127</span>
            <div class="social">
                <a href="#" aria-label="GitHub">🐙</a>
                <a href="#" aria-label="微博">📱</a>
                <a href="#" aria-label="邮箱">✉️</a>
            </div>
        </aside>

        <!-- ===== 右栏 80% ===== -->
        <main class="main">
            <h1>Lushanjun1127</h1>
            <p class="tagline">写代码 · 折腾博客 · 探索有趣的东西</p>
            <p class="desc">
                这里是 Lushanjun1127 的个人小站。<br />
                目前正在搭建自己的 GitHub Pages 主页和 Jekyll 博客。
            </p>
            <div class="links">
                <a href="#">📝 博客</a>
                <a href="https://github.com/lushanjun1127" target="_blank">🐱 GitHub</a>
                <a href="#">📧 邮箱</a>
            </div>
        </main>
    </div>
</body>
</html>
