<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lushanjun1127 · 个人主页</title>
    <style>
        /* 全局重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f0f2f5;
        }

        .site {
            display: flex;
            height: 100vh;
            width: 100%;
            overflow: hidden;
        }

        /* ===== 左栏 ===== */
        .sidebar {
            height: 100vh;
            background: linear-gradient(145deg, #6c5ce7, #a29bfe);
            padding: 48px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            color: #fff;
            flex-shrink: 0;
            overflow-y: auto;
            position: sticky;
            top: 0;
            /* 默认 20% */
            width: 20%;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 52px;
            margin-bottom: 20px;
            flex-shrink: 0;
        }

        .sidebar h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .sidebar .sub {
            font-size: 14px;
            opacity: 0.8;
            font-weight: 400;
            margin-bottom: 24px;
        }

        .sidebar .social {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .sidebar .social a {
            color: #fff;
            text-decoration: none;
            font-size: 22px;
            opacity: 0.75;
            transition: opacity 0.2s, transform 0.2s;
        }

        .sidebar .social a:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        /* ===== 右栏 ===== */
        .main {
            height: 100vh;
            padding: 60px 56px;
            overflow-y: auto;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            /* 默认 80% */
            width: 80%;
        }

        .main h1 {
            font-size: 36px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 8px;
        }

        .main .tagline {
            font-size: 20px;
            color: #6b7280;
            font-weight: 400;
            margin-bottom: 16px;
        }

        .main .desc {
            font-size: 16px;
            color: #4b5563;
            line-height: 1.9;
            max-width: 560px;
            margin-bottom: 28px;
        }

        .main .links {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .main .links a {
            display: inline-block;
            padding: 10px 24px;
            border-radius: 40px;
            background: #f0f2f5;
            color: #1a1a2e;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: background 0.25s, color 0.25s, transform 0.15s;
        }

        .main .links a:hover {
            background: #6c5ce7;
            color: #fff;
            transform: scale(1.04);
        }

        /* ============================================================ */
        /* ===== 自适应断点 ===== */

        /* 中等屏幕：左栏 25% / 右栏 75% */
        @media (max-width: 1024px) {
            .sidebar {
                width: 25%;
                padding: 36px 16px;
            }
            .main {
                width: 75%;
                padding: 44px 40px;
            }
            .avatar {
                width: 100px;
                height: 100px;
                font-size: 44px;
            }
            .sidebar h2 {
                font-size: 20px;
            }
            .main h1 {
                font-size: 30px;
            }
        }

        /* 小屏平板：左栏 30% / 右栏 70% */
        @media (max-width: 768px) {
            .sidebar {
                width: 30%;
                padding: 28px 14px;
            }
            .main {
                width: 70%;
                padding: 32px 28px;
            }
            .avatar {
                width: 80px;
                height: 80px;
                font-size: 36px;
                margin-bottom: 12px;
            }
            .sidebar h2 {
                font-size: 17px;
            }
            .sidebar .sub {
                font-size: 12px;
                margin-bottom: 16px;
            }
            .sidebar .social a {
                font-size: 18px;
            }
            .main h1 {
                font-size: 26px;
            }
            .main .tagline {
                font-size: 17px;
            }
            .main .desc {
                font-size: 15px;
            }
            .main .links a {
                padding: 8px 18px;
                font-size: 14px;
            }
        }

        /* 手机：折叠为上下布局 */
        @media (max-width: 480px) {
            .site {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
                overflow: visible;
            }

            .sidebar {
                width: 100%;
                height: auto;
                padding: 28px 20px;
                position: static;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                align-items: center;
                gap: 6px 16px;
            }

            .avatar {
                width: 64px;
                height: 64px;
                font-size: 28px;
                margin-bottom: 0;
            }

            .sidebar h2 {
                font-size: 17px;
                margin-bottom: 0;
            }

            .sidebar .sub {
                margin-bottom: 0;
                font-size: 13px;
            }

            .sidebar .social {
                margin-left: 4px;
            }

            .sidebar .social a {
                font-size: 18px;
            }

            .main {
                width: 100%;
                height: auto;
                padding: 28px 20px;
                justify-content: flex-start;
                min-height: 50vh;
            }

            .main h1 {
                font-size: 24px;
            }

            .main .tagline {
                font-size: 16px;
            }

            .main .desc {
                font-size: 14px;
                max-width: 100%;
            }

            .main .links a {
                font-size: 13px;
                padding: 8px 18px;
            }
        }

        /* 超小手机 */
        @media (max-width: 360px) {
            .sidebar {
                padding: 20px 12px;
                gap: 4px 10px;
            }
            .avatar {
                width: 52px;
                height: 52px;
                font-size: 22px;
            }
            .sidebar h2 {
                font-size: 15px;
            }
            .main {
                padding: 20px 14px;
            }
            .main h1 {
                font-size: 20px;
            }
            .main .links a {
                font-size: 12px;
                padding: 6px 14px;
            }
        }
    </style>
</head>
<body>
    <div class="site">
        <!-- ===== 左栏 ===== -->
        <aside class="sidebar">
            <div class="avatar">🌿</div>
            <h2>Lushanjun</h2>
            <span class="sub">@lushanjun1127</span>
            <div class="social">
                <a href="#" aria-label="GitHub">🐙</a>
                <a href="#" aria-label="微博">📱</a>
                <a href="#" aria-label="邮箱">✉️</a>
            </div>
        </aside>

        <!-- ===== 右栏 ===== -->
        <main class="main">
            <h1>Lushanjun1127</h1>
            <p class="tagline">写代码 · 折腾博客 · 探索有趣的东西</p>
            <p class="desc">
                这里是 Lushanjun1127 的个人小站。<br />
                目前正在搭建自己的 GitHub Pages 主页和 Jekyll 博客。
            </p>
            <div class="links">
                <a href="#">📝 博客</a>
                <a href="https://github.com/lushanjun1127" target="_blank">🐱 GitHub</a>
                <a href="#">📧 邮箱</a>
            </div>
        </main>
    </div>
</body>
</html>
