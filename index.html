<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lushanjun1127 · 个人主页</title>
    <style>
        /* 全局重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f0f2f5;
        }

        /* ===== 整个网站 ===== */
        .site {
            display: flex;
            height: 100vh; /* 铺满整个视口高度 */
            width: 100%;
            overflow: hidden;
        }

        /* ===== 左栏 20% ===== */
        .sidebar {
            width: 20%;
            height: 100vh;
            background: linear-gradient(145deg, #6c5ce7, #a29bfe);
            padding: 48px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            color: #fff;
            flex-shrink: 0;
            overflow-y: auto;
            position: sticky;
            top: 0;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 52px;
            margin-bottom: 20px;
            flex-shrink: 0;
        }

        .sidebar h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .sidebar .sub {
            font-size: 14px;
            opacity: 0.8;
            font-weight: 400;
            margin-bottom: 24px;
        }

        .sidebar .social {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .sidebar .social a {
            color: #fff;
            text-decoration: none;
            font-size: 22px;
            opacity: 0.75;
            transition: opacity 0.2s, transform 0.2s;
        }

        .sidebar .social a:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        /* ===== 右栏 80% ===== */
        .main {
            width: 80%;
            height: 100vh;
            padding: 60px 56px;
            overflow-y: auto;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .main h1 {
            font-size: 36px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 8px;
        }

        .main .tagline {
            font-size: 20px;
            color: #6b7280;
            font-weight: 400;
            margin-bottom: 16px;
        }

        .main .desc {
            font-size: 16px;
            color: #4b5563;
            line-height: 1.9;
            max-width: 560px;
            margin-bottom: 28px;
        }

        .main .links {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .main .links a {
            display: inline-block;
            padding: 10px 24px;
            border-radius: 40px;
            background: #f0f2f5;
            color: #1a1a2e;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: background 0.25s, color 0.25s, transform 0.15s;
        }

        .main .links a:hover {
            background: #6c5ce7;
            color: #fff;
            transform: scale(1.04);
        }

        /* ===== 小屏适配：折叠为上下布局 ===== */
        @media (max-width: 768px) {
            .site {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
                overflow: visible;
            }

            .sidebar {
                width: 100%;
                height: auto;
                padding: 32px 20px;
                position: static;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                gap: 6px 16px;
                border-radius: 0;
            }

            .avatar {
                width: 72px;
                height: 72px;
                font-size: 32px;
                margin-bottom: 0;
            }

            .sidebar h2 {
                font-size: 18px;
                margin-bottom: 0;
            }

            .sidebar .sub {
                margin-bottom: 0;
                font-size: 13px;
            }

            .sidebar .social {
                margin-left: 4px;
            }

            .sidebar .social a {
                font-size: 18px;
            }

            .main {
                width: 100%;
                height: auto;
                padding: 32px 24px;
                justify-content: flex-start;
                min-height: 60vh;
            }

            .main h1 {
                font-size: 26px;
            }

            .main .tagline {
                font-size: 17px;
            }
        }

        @media (max-width: 480px) {
            .sidebar {
                flex-direction: column;
                align-items: center;
                text-align: center;
                gap: 4px;
            }

            .main {
                padding: 24px 18px;
            }

            .main .links a {
                font-size: 13px;
                padding: 8px 18px;
            }
        }
    </style>
</head>
<body>
    <div class="site">
        <!-- ===== 左栏 20% ===== -->
        <aside class="sidebar">
            <div class="avatar">🌿</div>
            <h2>Lushanjun</h2>
            <span class="sub">@lushanjun1127</span>
            <div class="social">
                <a href="#" aria-label="GitHub">🐙</a>
                <a href="#" aria-label="微博">📱</a>
                <a href="#" aria-label="邮箱">✉️</a>
            </div>
        </aside>

        <!-- ===== 右栏 80% ===== -->
        <main class="main">
            <h1>Lushanjun1127</h1>
            <p class="tagline">写代码 · 折腾博客 · 探索有趣的东西</p>
            <p class="desc">
                这里是 Lushanjun1127 的个人小站。<br />
                目前正在搭建自己的 GitHub Pages 主页和 Jekyll 博客。
            </p>
            <div class="links">
                <a href="#">📝 博客</a>
                <a href="https://github.com/lushanjun1127" target="_blank">🐱 GitHub</a>
                <a href="#">📧 邮箱</a>
            </div>
        </main>
    </div>
</body>
</html>
